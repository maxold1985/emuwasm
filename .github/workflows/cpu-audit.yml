name: CPU source audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cpu-audit.yml'
      - 'CMakeLists.txt'
      - 'tests/boxedwine_x86_execution.cpp'
      - 'tests/boxedwine_pe32_execution.cpp'
      - 'tests/boxedwine_pe32_import_execution.cpp'
      - 'tests/pe32_fixture.h'
      - 'tests/pe32_loader.cpp'
      - 'include/emuwasm/pe32.h'
      - 'src/pe32.cpp'
      - 'src/pe32_modules.cpp'
      - 'include/emuwasm/pe32_modules.h'
      - 'tests/pe32_modules.cpp'
      - 'src/pe32_wine.cpp'
      - 'include/emuwasm/pe32_wine.h'
      - 'tests/pe32_wine.cpp'
      - 'tests/boxedwine_wine_dll_execution.cpp'
      - 'src/pe32_boxedwine.cpp'
      - 'include/emuwasm/pe32_boxedwine.h'
      - 'include/emuwasm/pe32_process.h'
      - 'src/pe32_process.cpp'
      - 'tests/pe32_process.cpp'
      - 'tests/boxedwine_win32_fs_execution.cpp'
      - 'tools/wine_link.cpp'

jobs:
  boxedwine-cpu:
    runs-on: ubuntu-latest
    steps:
      - name: Install upstream utility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsdl2-dev libgl1-mesa-dev gdb
      - name: Checkout EmuWasm
        uses: actions/checkout@v4
      - name: Checkout original BoxedWine sources
        uses: actions/checkout@v4
        with:
          repository: danoon2/Boxedwine
          ref: master
          path: boxedwine-upstream
      - name: Import original CPU and MMU sources
        shell: bash
        run: |
          mkdir -p engine/emulation
          cp -a boxedwine-upstream/source/emulation/cpu engine/emulation/
          cp -a boxedwine-upstream/source/emulation/softmmu engine/emulation/
          cp -a boxedwine-upstream/source/kernel engine/
          # Include procfs classes used by kernel and the filesystem implementation.
          cp -a boxedwine-upstream/source/util engine/
          cp -a boxedwine-upstream/source/io engine/
          # kprocess.cpp includes ../x11/x11.h from the original source tree.
          cp -a boxedwine-upstream/source/x11 engine/
          # Some original headers refer to ../../source/util relative to engine/emulation.
          # Preserve that expected source tree instead of editing upstream headers.
          ln -s "$GITHUB_WORKSPACE/boxedwine-upstream/source" engine/source
          # fpu.h uses a relative path from engine/emulation/cpu/common
          # resolving to the repository-root lib/softfloat directory.
          mkdir -p lib
          cp -a boxedwine-upstream/lib/softfloat lib/
          cp -a boxedwine-upstream/lib/simde lib/
          find engine/emulation/cpu engine/emulation/softmmu -type f \( -name '*.cpp' -o -name '*.h' \) | sort > cpu-files.txt
          echo "Original CPU/MMU files: $(wc -l < cpu-files.txt)"
      - name: Upload original source manifest
        uses: actions/upload-artifact@v4
        with:
          name: boxedwine-cpu-file-manifest
          path: cpu-files.txt
      - name: Configure CPU build (experimental)
        run: cmake -S . -B build-cpu -DEMUWASM_BUILD_EXTRACTED=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile original CPU (dependency discovery)
        run: cmake --build build-cpu --parallel 2
      - name: Configure original kernel dependency audit
        run: cmake -S . -B build-kernel -DEMUWASM_BUILD_EXTRACTED=ON -DEMUWASM_BUILD_KERNEL_OBJECTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile original kernel objects
        run: cmake --build build-kernel --target emuwasm_boxedwine_kernel --parallel 2
      - name: Configure x86 execution link probe
        run: cmake -S . -B build-x86 -DEMUWASM_BUILD_EXTRACTED=ON -DEMUWASM_BUILD_KERNEL_OBJECTS=ON -DEMUWASM_BUILD_X86_TEST=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Probe linking genuine x86 execution test
        id: x86_link
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-x86 --target emuwasm_x86_execution emuwasm_pe32_execution emuwasm_pe32_import_execution emuwasm_pe32_parser_test emuwasm_pe32_modules_test emuwasm_pe32_wine_test emuwasm_pe32_boxedwine emuwasm_boxedwine_wine_dll_execution emuwasm_win32_fs_execution emuwasm_pe32_process_test emuwasm_wine_link --parallel 2 2>&1 | tee x86-link.log
      - name: Upload x86 execution link diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxedwine-x86-link-diagnostics
          path: x86-link.log
          if-no-files-found: ignore
      - name: Run x86 instructions if link succeeded
        if: steps.x86_link.outcome == 'success'
        run: ctest --test-dir build-x86 -R '^(boxedwine_x86_execution|boxedwine_pe32_execution|boxedwine_pe32_import_execution|boxedwine_wine_dll_execution|boxedwine_win32_fs_execution|pe32_parser|pe32_modules|pe32_wine|pe32_process)$' --output-on-failure
      - name: Trace interpreter crash with GDB
        if: failure() && steps.x86_link.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          gdb -batch -ex 'set pagination off' -ex run -ex 'thread apply all bt 25' --args ./build-x86/emuwasm_x86_execution 2>&1 | tee x86-gdb.log
      - name: Upload interpreter crash trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxedwine-x86-gdb-backtrace
          path: x86-gdb.log
          if-no-files-found: ignore
      - name: Report x86 link status
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.x86_link.outcome }}" != "success" ]]; then
            echo "x86 interpreter executable NOT linked; inspect boxedwine-x86-link-diagnostics" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "x86 interpreter executable linked; see CTest result above" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify original CPU execution symbols
        shell: bash
        run: |
          set -euo pipefail
          LIB=build-cpu/libemuwasm_boxedwine.a
          test -s "$LIB"
          nm -C --defined-only "$LIB" > cpu-symbols.txt
          # Verify the archive contains compiled BoxedWine CPU and instruction implementations.
          grep -E 'CPU::|NormalCPU::|normalCPU|common_' cpu-symbols.txt > cpu-matching-symbols.txt
          test -s cpu-matching-symbols.txt
          echo "Compiled BoxedWine CPU symbols: $(wc -l < cpu-matching-symbols.txt)"
      - name: Upload compiled CPU symbol inventory
        uses: actions/upload-artifact@v4
        with:
          name: boxedwine-cpu-symbols
          path: |
            cpu-symbols.txt
            cpu-matching-symbols.txt
