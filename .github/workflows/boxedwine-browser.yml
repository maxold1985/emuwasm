name: BoxedWine browser runtime (WASM and WebGL)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/boxedwine-browser.yml'

jobs:
  wasm-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout upstream full BoxedWine runtime
        uses: actions/checkout@v4
        with:
          repository: danoon2/Boxedwine
          ref: master
          path: boxedwine-upstream
          persist-credentials: false
      - name: Checkout Emscripten SDK
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          path: emsdk
          persist-credentials: false
      - name: Activate the Emscripten toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
          source emsdk/emsdk_env.sh
          emcc --version
      - name: Build complete BoxedWine for WASM (upstream release)
        shell: bash
        run: |
          set -euo pipefail
          source emsdk/emsdk_env.sh
          make -C boxedwine-upstream/project/emscripten release -j2
          build=boxedwine-upstream/project/emscripten/Build/Release
          test -s "$build/boxedwine.html"
          test -s "$build/boxedwine.js"
          test -s "$build/boxedwine.wasm"
          # Bundled local web server supplies COOP/COEP for sound or pthread builds.
          cp boxedwine-upstream/project/emscripten/server.mjs "$build/server.mjs"
          printf '%s\n' 'Required separately: boxedwine.zip (full Wine Linux filesystem) and YOUR game zip' > "$build/README-GAME-FILES.txt"
          ls -lh "$build"/boxedwine.*
      - name: Upload runnable browser WASM + HTML + JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: emuwasm-boxedwine-full-webgl
          path: boxedwine-upstream/project/emscripten/Build/Release/
          if-no-files-found: error
