name: Build Wine PE32 DLLs and WASM app

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wine-bundle.yml'
      - 'scripts/collect_wine_dlls.py'
      - 'tools/wine_link.cpp'

jobs:
  wine-i386:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine source-build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git make pkg-config flex bison \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            libz-dev libfreetype-dev
      - name: Fetch pinned Wine source
        run: |
          git clone --depth 1 --branch wine-10.0 \
            https://github.com/wine-mirror/wine.git wine-source
          git -C wine-source rev-parse HEAD > wine-source-revision.txt
      - name: Configure Wine i386 PE build
        run: |
          mkdir wine-build
          cd wine-build
          ../wine-source/configure --enable-archs=i386 --disable-tests \
            --with-mingw --without-x --without-cups --without-alsa \
            --without-pulse --without-gstreamer \
            > ../wine-configure.log 2>&1 || {
              tail -n 150 ../wine-configure.log
              exit 1
            }
          tail -n 30 ../wine-configure.log
      - name: Compile core Wine PE32 DLLs from source
        run: |
          make -C wine-build -j 4 \
            dlls/ntdll/i386-windows/ntdll.dll \
            dlls/kernelbase/i386-windows/kernelbase.dll \
            dlls/kernel32/i386-windows/kernel32.dll \
            dlls/advapi32/i386-windows/advapi32.dll \
            dlls/gdi32/i386-windows/gdi32.dll \
            dlls/user32/i386-windows/user32.dll
      - name: Validate and collect Wine DLLs
        run: |
          python3 scripts/collect_wine_dlls.py \
            --source wine-build/dlls \
            --output dist-wine \
            --origin "Wine 10.0 source build (wine-mirror/wine wine-10.0)" \
            --min-dlls 6
          cp wine-source/LICENSE dist-wine/wine/LICENSE.Wine
          cp wine-source-revision.txt dist-wine/wine/source-revision.txt
          du -sh dist-wine/wine
      - uses: actions/upload-artifact@v4
        with:
          name: wine-i386-built-from-source
          path: dist-wine/wine/
          if-no-files-found: error
          retention-days: 30

  wasm-with-wine:
    needs: wine-i386
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build WebAssembly tools
        run: |
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --parallel 2 \
            --target emuwasm_pe32_inspect emuwasm_wine_link
      - name: Package readable JS and WebAssembly
        run: |
          mkdir -p dist-app
          for name in emuwasm_pe32_inspect emuwasm_wine_link; do
            npx --yes prettier@3.6.2 --parser babel --print-width 100 \
              < "build-wasm/${name}.js" > "dist-app/${name}.js"
            cp "build-wasm/${name}.wasm" "dist-app/${name}.wasm"
            node --check "dist-app/${name}.js"
          done
          node dist-app/emuwasm_wine_link.js --help
          cp WASM-README.md dist-app/README.md
      - name: Insert compiled Wine DLLs into app/wine
        uses: actions/download-artifact@v4
        with:
          name: wine-i386-built-from-source
          path: dist-app/wine
      - name: Verify package layout
        run: |
          test -s dist-app/wine/i386-windows/ntdll.dll
          test -s dist-app/wine/i386-windows/kernel32.dll
          test -s dist-app/wine/i386-windows/kernelbase.dll
          test -s dist-app/wine/manifest.json
          python3 scripts/collect_wine_dlls.py \
            --source dist-app/wine/i386-windows \
            --output dist-check \
            --origin "Validation of compiled Wine DLLs" --min-dlls 6
          echo "Wine DLLs packaged in dist-app/wine/i386-windows"
      - uses: actions/upload-artifact@v4
        with:
          name: emuwasm-wasm-with-wine
          path: dist-app/
          if-no-files-found: error
          retention-days: 30
