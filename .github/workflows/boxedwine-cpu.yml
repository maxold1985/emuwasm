name: BoxedWine x86 CPU integration diagnostics
on:
  workflow_dispatch:

jobs:
  boxedwine-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch original BoxedWine sources
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/danoon2/Boxedwine.git boxedwine-upstream
          test -d boxedwine-upstream/source/emulation/cpu
          test -d boxedwine-upstream/source/emulation/softmmu
          mkdir -p engine
          cp -a boxedwine-upstream/source/emulation engine/
          cp -a boxedwine-upstream/source/kernel engine/
          cp -a boxedwine-upstream/source/util engine/
          cp -a boxedwine-upstream/source/io engine/
          # Original soft-MMU headers use ../../source/util/... relative to engine/emulation.
          # Keep the original source/ hierarchy alongside the staged engine/ tree.
          ln -s ../boxedwine-upstream/source source
          test -f source/util/bnativeheap.h
          echo "Original BoxedWine source trees staged under engine/"
      - name: Stage upstream SoftFloat C sources
        shell: bash
        run: |
          set -euo pipefail
          # The CPU integration CMake target expects SoftFloat's source tree
          # at lib/softfloat/source and its 8086-SSE specialization.
          source_dir=""
          while IFS= read -r candidate; do
            if find "$candidate" -maxdepth 1 -name '*.c' -print -quit | grep -q . &&
               find "$candidate/8086-SSE" -maxdepth 1 -name '*.c' -print -quit 2>/dev/null | grep -q .; then
              source_dir="$candidate"
              break
            fi
          done < <(find boxedwine-upstream -type d -name source | sort)
          if [ -z "$source_dir" ]; then
            echo "::error::SoftFloat C source tree (including 8086-SSE) was not found upstream."
            find boxedwine-upstream -iname '*softfloat*' | head -60
            exit 1
          fi
          mkdir -p lib/softfloat
          cp -a "$source_dir" lib/softfloat/
          echo "SoftFloat staged from $source_dir"
          test -n "$(find lib/softfloat/source -maxdepth 1 -name '*.c' -print -quit)"
          test -n "$(find lib/softfloat/source/8086-SSE -maxdepth 1 -name '*.c' -print -quit)"
      - name: Install original BoxedWine runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsdl2-dev libcurl4-openssl-dev libgl-dev libsimde-dev
      - name: Stage SIMDe headers for BoxedWine
        shell: bash
        run: |
          set -euo pipefail
          # cpu.h includes simde/x86/sse.h; CMake already adds lib/simde
          # to the BoxedWine target's include directories.
          test -f /usr/include/simde/x86/sse.h
          mkdir -p lib/simde
          cp -a /usr/include/simde lib/simde/
          test -f lib/simde/simde/x86/sse.h
      - name: Configure original CPU and soft-MMU integration
        run: |
          cmake -S . -B build-boxedwine -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DEMUWASM_BUILD_EXTRACTED=ON \
            -DEMUWASM_BUILD_KERNEL_OBJECTS=ON \
            -DEMUWASM_BUILD_X86_TEST=ON
      - name: Compile real x86 CPU and PE32 bridge
        run: cmake --build build-boxedwine --parallel 2
      - name: Execute CPU and PE32 tests with diagnostics
        run: |
          ulimit -c 0
          ctest --test-dir build-boxedwine -R '^boxedwine_' --output-on-failure --timeout 60
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boxedwine-cpu-diagnostics
          path: |
            build-boxedwine/Testing/Temporary/LastTest.log
            build-boxedwine/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
