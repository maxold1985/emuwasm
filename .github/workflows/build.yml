name: Build scaffold
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Configure
        run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-wasm --parallel 2
      - name: Verify runnable WebAssembly CLI
        run: |
          test -s build-wasm/emuwasm_pe32_inspect.js
          test -s build-wasm/emuwasm_pe32_inspect.wasm
          test -s build-wasm/emuwasm_wine_link.js
          test -s build-wasm/emuwasm_wine_link.wasm
          node build-wasm/emuwasm_wine_link.js --help
      - name: Format actual generated JavaScript
        run: |
          # Format the real build outputs, not only a later copied version.
          # .gitignore excludes *.js, so --write silently skips them.
          # Read JS from stdin with an explicit parser to bypass ignore rules.
          for name in emuwasm_pe32_inspect emuwasm_wine_link; do
            npx --yes prettier@3.6.2 --parser babel --print-width 100 \
              < "build-wasm/${name}.js" > "build-wasm/${name}.formatted.js"
            mv "build-wasm/${name}.formatted.js" "build-wasm/${name}.js"
          done
          node --check build-wasm/emuwasm_pe32_inspect.js
          node --check build-wasm/emuwasm_wine_link.js
          node build-wasm/emuwasm_wine_link.js --help
          python3 - <<'PY'
          from pathlib import Path
          for name in ("emuwasm_pe32_inspect", "emuwasm_wine_link"):
              path = Path("build-wasm") / (name + ".js")
              data = path.read_text(encoding="utf-8")
              lines = data.splitlines()
              print(f"{path}: {len(lines)} lines, {len(data)} characters")
              if len(lines) < 100:
                  raise SystemExit(f"ERROR: {path} remains single-line or insufficiently formatted")
          PY
      - name: Package WebAssembly executables
        run: |
          mkdir -p dist-wasm
          cp build-wasm/emuwasm_pe32_inspect.js build-wasm/emuwasm_pe32_inspect.wasm dist-wasm/
          cp build-wasm/emuwasm_wine_link.js build-wasm/emuwasm_wine_link.wasm dist-wasm/
          cp WASM-README.md dist-wasm/README.md
      - name: Publish downloadable WebAssembly package
        uses: actions/upload-artifact@v4
        with:
          name: emuwasm-wasm-node
          path: dist-wasm/
          if-no-files-found: error
          retention-days: 30

  windows:
    # Pin runner image that provides the VS 2022 generator.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Visual Studio 2022 x64
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Compile native tools
        run: cmake --build build-windows --config Release --parallel 2
      - name: Run native tests
        run: ctest --test-dir build-windows -C Release --output-on-failure
      - name: Package Windows executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          Copy-Item build-windows/Release/emuwasm_pe32_inspect.exe dist-windows/
          Copy-Item build-windows/Release/emuwasm_wine_link.exe dist-windows/
          Copy-Item README.md dist-windows/
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: emuwasm-windows-x64
          path: dist-windows/
          if-no-files-found: error
          retention-days: 30

  wine-pe32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable Ubuntu i386 architecture and install Wine PE packages
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine32:i386 libwine:i386
      - name: Locate real Wine PE32 DLLs
        shell: bash
        run: |
          set -euo pipefail
          for root in /usr/lib/i386-linux-gnu/wine/i386-windows /usr/lib/wine/i386-windows; do
            if [ -d "$root" ]; then
              echo "WINE_PE_ROOT=$root" >> "$GITHUB_ENV"
              ls -l "$root"/wsock32.dll "$root"/winmm.dll "$root"/ddraw.dll
              exit 0
            fi
          done
          echo "Wine i386-windows directory not found" >&2
          exit 1
      - name: Collect verified PE32 DLLs
        shell: bash
        run: |
          python3 scripts/collect_wine_dlls.py --source "$WINE_PE_ROOT" --output dist-wine --origin "Ubuntu 24.04 libwine:i386" --min-dlls 6
          python3 - <<'PY'
          from pathlib import Path
          required = ("wsock32.dll", "winmm.dll", "ddraw.dll", "kernel32.dll", "user32.dll", "ole32.dll", "ntdll.dll")
          base = Path("dist-wine/wine/i386-windows")
          missing = [name for name in required if not (base / name).is_file()]
          if missing:
              raise SystemExit("Missing required Wine PE32 DLLs: " + ", ".join(missing))
          print("Verified required Prism3D Wine DLLs:", ", ".join(required))
          PY
      - name: Upload Wine i386 PE32 DLL bundle
        uses: actions/upload-artifact@v4
        with:
          name: emuwasm-wine-i386-pe32
          path: dist-wine/
          if-no-files-found: error
          retention-days: 30
