name: Windows Prism3D launcher smoke tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_boxedwine_game_windows.ps1'
      - 'scripts/run_prism3d_windows.bat'
      - '.github/workflows/windows-launcher-tests.yml'

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/run_boxedwine_game_windows.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw "PowerShell parse failed."
          }
      - name: Execute launcher dry-run against synthetic game folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP 'prism3d-smoke'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $game = Join-Path $temp 'game'
          New-Item -ItemType Directory -Force -Path $game | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $game 'prism3d.exe'), [byte[]](0x4D,0x5A))
          $zip = Join-Path $temp 'WineRoot.zip'
          [IO.File]::WriteAllBytes($zip, [byte[]](0x50,0x4B,0x03,0x04))
          $exe = (Get-Command powershell.exe).Source
          $text = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/run_boxedwine_game_windows.ps1 -GameDirectory $game -WineRootZip $zip -BoxedWineExecutable $exe -ProfileDirectory (Join-Path $temp 'profile') -DryRun 2>&1 | Out-String
          $text | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Windows dry-run failed: $LASTEXITCODE" }
          if ($text -notmatch '/mnt/drive_d' -or $text -notmatch 'D:\\prism3d.exe') { throw 'Expected mapped Windows drive or POSIX working directory not found' }
          $diagnostics = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/run_boxedwine_game_windows.ps1 -GameDirectory $game -WineRootZip $zip -BoxedWineExecutable $exe -ProfileDirectory (Join-Path $temp 'profile') -WinXP -DebugWine -NoSound -Pentium3 -DryRun 2>&1 | Out-String
          $diagnostics | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "WinXP diagnostics dry-run failed: $LASTEXITCODE" }
          foreach ($expected in @('wine-set-winxp.log', 'HKCU\Software\Wine', 'winxp', 'WINEDEBUG=+seh,+loaddll', '-nosound', '-p3', 'prism3d-', '/mnt/drive_d')) {
            if (-not $diagnostics.Contains($expected)) { throw "Expected diagnostic switch missing: $expected" }
          }
          if ($diagnostics.Contains('WINEDEBUG=+seh,+loaddll,+virtual')) { throw 'Default debug tracing must not include expensive +virtual channel' }
          if ($diagnostics.Contains('-disableLinearMemory')) { throw 'Legacy MMU must be opt-in for builds of the BoxedWine master branch' }
          $legacy = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/run_boxedwine_game_windows.ps1 -GameDirectory $game -WineRootZip $zip -BoxedWineExecutable $exe -ProfileDirectory (Join-Path $temp 'profile') -LegacyMMU -TraceVirtualMemory -DryRun 2>&1 | Out-String
          $legacy | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Legacy MMU dry-run failed: $LASTEXITCODE" }
          if (-not $legacy.Contains('-disableLinearMemory') -or -not $legacy.Contains('WINEDEBUG=+seh,+loaddll,+virtual')) { throw 'Missing explicit legacy MMU and verbose memory-tracing switches' }

      - name: Regression - Wine setup success with emulator exit code 1 must still start game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'boxedwine-exit-one-test'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $game = Join-Path $root 'game'
          New-Item -ItemType Directory -Force -Path $game | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $game 'prism3d.exe'), [byte[]](0x4d,0x5a))
          $zip = Join-Path $root 'WineRoot.zip'
          [IO.File]::WriteAllBytes($zip, [byte[]](0x50,0x4b,0x03,0x04))
          $stub = Join-Path $root 'boxedwine-stub.cmd'
          @'
          @echo off
          setlocal EnableExtensions
          set "logfile="
          :scan
          if "%~1"=="" goto execute
          if /i "%~1"=="-log" set "logfile=%~2"
          shift
          goto scan
          :execute
          if not defined logfile exit /b 3
          echo BoxedWine mock invocation> "%logfile%"
          echo %logfile% | findstr /i "wine-set-winxp" >nul
          if not errorlevel 1 (
              echo reg: The operation completed successfully>> "%logfile%"
              exit /b 1
          )
          echo [sys] startup ...>> "%logfile%"
          exit /b 1
          '@ | Set-Content -LiteralPath $stub -Encoding Ascii
          $logs = Join-Path $root 'logs'
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/run_boxedwine_game_windows.ps1 -WinXP -GameDirectory $game -WineRootZip $zip -BoxedWineExecutable $stub -ProfileDirectory (Join-Path $root 'profile') -LogDirectory $logs 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 1) { throw "Expected simulated game exit 1, got $LASTEXITCODE" }
          $gameLogs = @(Get-ChildItem -LiteralPath $logs -Filter 'prism3d-*.log' -File)
          $launcherLogs = @(Get-ChildItem -LiteralPath $logs -Filter 'launcher-*.log' -File)
          if ($gameLogs.Count -ne 1 -or $launcherLogs.Count -ne 1) { throw 'Expected separate Wine game and launcher logs' }
          $stages = Get-Content -LiteralPath $launcherLogs[0].FullName -Raw
          if (-not $stages.Contains('Wine reg.exe completion confirmed: True') -or -not $stages.Contains('Stage: Prism3D launch requested') -or -not $stages.Contains('Stage: Prism3D emulator process returned 1')) { throw "The second stage was skipped: $stages" }
          if (-not (Get-Content -LiteralPath $gameLogs[0].FullName -Raw).Contains('[sys] startup')) { throw 'Game stub did not run after Wine setup' }
          # The simulated game deliberately returns 1; the workflow test itself succeeded.
          $global:LASTEXITCODE = 0
          exit 0
