name: 18 Wheels of Steel browser port (WASM WebGL)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/18wos-browser-port.yml'
      - 'browser_port/**'
      - 'scripts/package_boxedwine_game.py'
      - 'scripts/patch_boxedwine_webgl.py'
      - 'scripts/test_patch_boxedwine_webgl.py'
      - 'scripts/test_gl4es_formats.cpp'
      - 'scripts/test_gl4es_framebuffer.cpp'
      - 'scripts/test_gl4es_gl_functions.cpp'

permissions:
  contents: read
  actions: read

jobs:
  browser-port-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Python and JavaScript syntax
        run: |
          python3 -m py_compile browser_port/server.py browser_port/test_server.py scripts/package_boxedwine_game.py
          node --check browser_port/port.js
          node --check browser_port/diagnostics.js
          node --check browser_port/gl_usage.js
          node browser_port/test_gl_usage.mjs
          node browser_port/test_port.mjs
          python3 -m unittest discover -s scripts -p 'test_patch_boxedwine_webgl.py' -v
          c++ -std=c++11 -Wall -Wextra -Werror -Ibrowser_port scripts/test_gl4es_formats.cpp -o /tmp/test_gl4es_formats
          /tmp/test_gl4es_formats
          c++ -std=c++11 -Wall -Wextra -Werror -Ibrowser_port scripts/test_gl4es_framebuffer.cpp -o /tmp/test_gl4es_framebuffer
          /tmp/test_gl4es_framebuffer
          c++ -std=c++11 -Wall -Wextra -Werror -Ibrowser_port scripts/test_gl4es_gl_functions.cpp -o /tmp/test_gl4es_gl_functions
          /tmp/test_gl4es_gl_functions
      - name: Verify browser upload security and local WASM service
        run: |
          python3 -m unittest discover -s browser_port -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_boxedwine_game_tools.py' -v

  build-webgl:
    needs: browser-port-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout EmuWasm shader/texture compatibility overlay
        uses: actions/checkout@v4
        with:
          path: emuwasm
      - name: Checkout upstream BoxedWine OpenGL backend
        uses: actions/checkout@v4
        with:
          repository: danoon2/Boxedwine
          ref: 2dbabfcd108ae58f803cd4db08d70b67b003af74
          path: boxedwine-upstream
          persist-credentials: false
      - name: Checkout Emscripten SDK
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          path: emsdk
          persist-credentials: false
      - name: Apply OpenGL desktop to WebGL2 texture compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          python3 emuwasm/scripts/patch_boxedwine_webgl.py boxedwine-upstream
          grep -q 'EmuWasmWebGLPixelUpload' boxedwine-upstream/source/opengl/glcommon.cpp
          grep -q 'GL_FUNCTION_CUSTOM(TexImage2D' boxedwine-upstream/source/opengl/glfunctions.h
          test -s boxedwine-upstream/source/opengl/emuwasm_gl4es_formats.h
          test -s boxedwine-upstream/source/opengl/emuwasm_gl4es_framebuffer.h
          grep -q 'normalize_renderbuffer_format' boxedwine-upstream/source/opengl/glfunctions_ext2.cpp
          grep -q 'GL_FUNCTION_CUSTOM(DrawBuffer' boxedwine-upstream/source/opengl/glfunctions.h
          grep -q 'GL_FUNCTION_CUSTOM(ReadBuffer' boxedwine-upstream/source/opengl/glfunctions.h
          grep -q 'emuwasm_gl4es_get_tex_image_rgba8' boxedwine-upstream/source/opengl/glcommon.cpp
          test -s boxedwine-upstream/source/opengl/emuwasm_gl4es_gl_functions.inc
          test -s boxedwine-upstream/source/opengl/emuwasm_gl4es_gl_functions.h
      - name: Compile new patched WASM/WebGL runtime, with GL counters
        shell: bash
        run: |
          set -euo pipefail
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
          source emsdk/emsdk_env.sh
          emcc --version
          make -C boxedwine-upstream/project/emscripten release WEBGL_COUNTERS=1 -j2
          build=boxedwine-upstream/project/emscripten/Build/Release
          test -s "$build/boxedwine.html"
          test -s "$build/boxedwine.js"
          test -s "$build/boxedwine.wasm"
          printf '%s\n' 'EmuWasm: patched BoxedWine OpenGL to WebGL2 BGRA/BGR support' \
            'Source: danoon2/Boxedwine @ 2dbabfcd108ae58f803cd4db08d70b67b003af74' \
            'Build: WEBGL_COUNTERS=1; Wine Linux ZIP/game ZIP not included' \
            > "$build/EMUWASM-OPENGL-BUILD.txt"
          ls -lh "$build"/boxedwine.*
      - name: Publish freshly compiled OpenGL/WebGL2 runtime
        uses: actions/upload-artifact@v4
        with:
          name: emuwasm-boxedwine-patched-webgl2
          path: boxedwine-upstream/project/emscripten/Build/Release/
          if-no-files-found: error

  package-browser:
    needs: [browser-port-tests, build-webgl]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: emuwasm
      - name: Download freshly built patched WebGL2 runtime from this run
        uses: actions/download-artifact@v4
        with:
          name: emuwasm-boxedwine-patched-webgl2
          path: browser-build
      - name: Integrate game launcher and verified Python localhost server
        shell: bash
        run: |
          set -euo pipefail
          test -s browser-build/boxedwine.html
          test -s browser-build/boxedwine.js
          test -s browser-build/boxedwine.wasm
          cp emuwasm/browser_port/index.html browser-build/index.html
          cp emuwasm/browser_port/port.css browser-build/port.css
          cp emuwasm/browser_port/port.js browser-build/port.js
          cp emuwasm/browser_port/diagnostics.js browser-build/diagnostics.js
          cp emuwasm/browser_port/gl_usage.js browser-build/gl_usage.js
          cp emuwasm/browser_port/boxedwine_webgl_pixel.inc browser-build/boxedwine_webgl_pixel.inc
          cp emuwasm/browser_port/emuwasm_gl4es_formats.h browser-build/emuwasm_gl4es_formats.h
          cp emuwasm/browser_port/emuwasm_gl4es_framebuffer.h browser-build/emuwasm_gl4es_framebuffer.h
          cp emuwasm/browser_port/emuwasm_gl4es_gl_functions.inc browser-build/emuwasm_gl4es_gl_functions.inc
          cp emuwasm/browser_port/emuwasm_gl4es_gl_functions.h browser-build/emuwasm_gl4es_gl_functions.h
          cp emuwasm/browser_port/server.py browser-build/server.py
          cp emuwasm/scripts/package_boxedwine_game.py browser-build/package_boxedwine_game.py
          # Inject early debugging before the upstream filesystem shell and WASM.
          # This makes JS startup failures visible in the browser and terminal.
          python3 - <<'PY'
          from pathlib import Path
          page = Path('browser-build/boxedwine.html')
          html = page.read_text(encoding='utf-8')
          # Emscripten's HTML optimizer removes quote marks and most whitespace:
          #   <script src=fsfs.js></script>
          # Accept both its minified output and the original source HTML.
          markers = (
              '<script src=fsfs.js></script>',
              '<script src="fsfs.js"></script>',
              "<script src='fsfs.js'></script>",
          )
          matches = [marker for marker in markers if marker in html]
          if len(matches) != 1:
              raise SystemExit(f'Unable to inject early WASM diagnostics: fsfs tags={len(matches)}')
          marker = matches[0]
          html = html.replace(marker, '<script src=diagnostics.js></script>' +
                              '<script src=gl_usage.js></script>' + marker, 1)
          assert html.index('diagnostics.js') < html.index('gl_usage.js') < html.index('fsfs.js')
          page.write_text(html, encoding='utf-8')
          print('Injected diagnostic bridge into minified Emscripten HTML')
          PY
          cat > browser-build/start_windows.bat <<'BAT'
          @echo off
          cd /d "%~dp0"
          echo EmuWasm - 18 Wheels of Steel / Prism3D no navegador
          echo.
          set "PORT=8000"
          if not "%~1"=="" set "PORT=%~1"
          echo Abrindo http://127.0.0.1:%PORT%/
          py -3 server.py --port "%PORT%"
          if errorlevel 1 (
              echo.
              echo ERRO: Python 3 nao encontrado ou porta %PORT% indisponivel.
          )
          pause
          BAT
          cat > browser-build/README-PORT-BROWSER.txt <<'TXT'
          18 WHEELS OF STEEL: PEDAL TO THE METAL - BROWSER EXPERIMENT
          BoxedWine full x86 + Wine for WebAssembly, graphics via WebGL.

          WINDOWS 10:
          1. Extract ALL files in this ZIP.
          2. Double-click start_windows.bat (Python 3 required).
          3. Open http://127.0.0.1:8000/ in Chrome or Edge.
             If your server runs on 8085: start_windows.bat 8085
             Then use http://127.0.0.1:8085/ instead.
          4. Import your compatible Wine filesystem ZIP using the web page.
             Example: TinyCore15Wine11.0.zip from the original BoxedWine UI.
          5. First create ZIP of YOUR OWN installed game:
             py -3 package_boxedwine_game.py --game-dir "C:\GOG Games\18 Wheels of Steel Pedal to the Metal" --exe prism3d.exe --output prism3d.zip
          6. Import prism3d.zip using the browser page.
          7. Select OpenGL/WebGL, then click Start.
          8. Choose RAM mode for a first diagnostic run if IndexedDB stalls.
          9. The BoxedWine page has a diagnostics panel with a Download Log button.
             The terminal also shows JavaScript errors and ZIP/wasm request milestones.
             Private log: .local-game-data\.diagnostics\browser-console.log

          Files stay local under .local-game-data and are only served from 127.0.0.1.
          Do not host this folder on the internet or publish copyrighted game ZIPs.
          Wine filesystem and game data are NOT bundled here.
          BoxedWine WASM is the existing upstream runtime, not a native game source port.
          Real-game execution and 3D rendering are NOT yet verified.
          The Windows log "Vulkan not compiled into Boxedwine" does not establish
          that this WebGL build can render the game's DirectDraw/Direct3D calls.
          TXT
          test -s browser-build/server.py
          python3 -m py_compile browser-build/server.py
          # The upstream Actions artifact also contains hundreds of MSBuild/Emscripten
          # intermediate object/dependency files under home/runner. They are not
          # required by the browser and should not be redistributed.
          rm -rf browser-build/home browser-build/__pycache__
          test -s browser-build/diagnostics.js
          test -s browser-build/gl_usage.js
          test -s browser-build/emuwasm_gl4es_formats.h
          test -s browser-build/emuwasm_gl4es_framebuffer.h
          test -s browser-build/emuwasm_gl4es_gl_functions.inc
          test -s browser-build/emuwasm_gl4es_gl_functions.h
          test -s browser-build/boxedwine.wasm
          test -s browser-build/EMUWASM-OPENGL-BUILD.txt
          ls -lah browser-build | head -40
      - name: Publish local browser port + WebAssembly runtime (no game content)
        uses: actions/upload-artifact@v4
        with:
          name: emuwasm-18wos-browser-webgl-wasm
          path: browser-build/
          if-no-files-found: error
